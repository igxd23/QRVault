<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR Scanner</title>

    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        #reader {
            width: 220px;
            height: 220px;
            margin: auto;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
            text-align: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

<h3 style="text-align:center;">Scan QR Code</h3>

<div id="reader"></div>
<div id="result">Waiting for QR...</div>

<script>
    async function sendToServer(qrText) {
        const res = await fetch("/save-scan", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ qr_data: qrText })
        });

        const data = await res.json();
        console.log("Saved:", data);
    }

    function onScanSuccess(decodedText) {
        document.getElementById("result").innerHTML = "Scanned: " + decodedText;

        // Save to server
        sendToServer(decodedText);

        // Stop scanning
        html5QrcodeScanner.clear();
    }

    const html5QrcodeScanner = new Html5QrcodeScanner(
        "reader",
        { fps: 10, qrbox: 200 }
    );

    html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
